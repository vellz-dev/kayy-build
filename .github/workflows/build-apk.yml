name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        type: string
      build_mode:
        description: "Build mode"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug
          - profile

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download ZIP from Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" \
            -o release.json

          python3 - <<'PY'
          import json, sys
          with open("release.json", encoding="utf-8") as f:
              data = json.load(f)

          zips = [a for a in data.get("assets", [])
                  if a.get("name", "").lower().endswith(".zip")]

          if not zips:
              raise SystemExit("ERROR: Release tidak memiliki asset .zip")

          asset = zips[0]
          print("ZIP:", asset["name"])
          open("asset_url.txt", "w").write(asset["browser_download_url"])
          PY

          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "$(cat asset_url.txt)" \
            -o project.zip

      - name: Extract ZIP
        run: |
          set -euo pipefail
          rm -rf project
          mkdir project
          unzip -q project.zip -d project

      - name: Find Flutter project
        run: |
          set -euo pipefail

          PUBSPEC="$(find project -type f -name pubspec.yaml \
            -not -path '*/.dart_tool/*' -print -quit)"

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml tidak ditemukan."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $PROJECT_DIR"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" || true

      - name: Repair CI local.properties
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          if [ -d android ]; then
            printf 'sdk.dir=%s\nflutter.sdk=%s\n' \
              "$ANDROID_HOME" \
              "$FLUTTER_ROOT" > android/local.properties
          else
            echo "ERROR: folder android tidak ditemukan."
            exit 1
          fi

      - name: Show project versions
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter --version
          dart --version

          echo "=== Gradle wrapper ==="
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            grep -E 'distributionUrl=' \
              android/gradle/wrapper/gradle-wrapper.properties || true
          fi

          echo "=== Android plugins ==="
          grep -R -E \
            'com.android.application.*version|com.android.tools.build:gradle|org.jetbrains.kotlin.android.*version' \
            android --include='*.gradle' --include='*.gradle.kts' --include='settings.gradle*' \
            || true

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          flutter pub get

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
        run: |
          set -euo pipefail

          flutter clean
          flutter pub get

          case "$BUILD_MODE" in
            debug)
              flutter build apk --debug
              ;;
            profile)
              flutter build apk --profile
              ;;
            release)
              flutter build apk --release
              ;;
            *)
              echo "ERROR: build_mode tidak valid: $BUILD_MODE"
              exit 1
              ;;
          esac

      - name: Collect APK
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/build/app/outputs/flutter-apk" \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            find "$PROJECT_DIR/build" -type f 2>/dev/null | head -200 || true
            exit 1
          fi

          cp "$APK" app-release.apk
          echo "APK berhasil ditemukan: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: app-release.apk
          if-no-files-found: error
          retention-days: 7
